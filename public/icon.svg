<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="volcanoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="magmaGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="60%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="smokeGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="rgba(244, 63, 94, 0.7)"/>
      <stop offset="100%" stop-color="rgba(251, 191, 36, 0.1)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#f43f5e" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Eruption Plume & Glow -->
  <circle cx="256" cy="170" r="80" fill="url(#smokeGrad)" filter="url(#glow)"/>
  
  <!-- Plume Pillars -->
  <path d="M 230 240 Q 200 160 236 100 Q 256 70 276 100 Q 312 160 282 240 Z" fill="url(#magmaGrad)" opacity="0.9" filter="url(#glow)"/>
  <path d="M 246 220 Q 230 150 256 110 Q 282 150 266 220 Z" fill="#fef08a" opacity="0.95"/>

  <!-- Volcano Mountain Body -->
  <path d="M 216 230 L 296 230 L 420 410 C 424 416 418 424 410 424 L 102 424 C 94 424 88 416 92 410 Z" fill="url(#volcanoGrad)" stroke="#475569" stroke-width="3"/>

  <!-- Mountain Shading & Ridges -->
  <path d="M 256 230 L 256 424 L 102 424 C 94 424 88 416 92 410 L 216 230 Z" fill="#090d16" opacity="0.45"/>
  <path d="M 256 230 L 268 310 L 244 360 L 256 424" stroke="#f43f5e" stroke-width="3.5" fill="none" opacity="0.8"/>

  <!-- Crater Rim Glow -->
  <ellipse cx="256" cy="230" rx="42" ry="14" fill="#fb923c" filter="url(#glow)"/>
  <ellipse cx="256" cy="230" rx="34" ry="10" fill="#fef08a"/>

  <!-- Seismic Wave Pulse Overlay -->
  <path d="M 64 360 L 170 360 L 195 315 L 215 395 L 235 340 L 256 405 L 277 340 L 297 395 L 317 315 L 342 360 L 448 360" 
        fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" filter="url(#glow)"/>

  <!-- Pulsing Radar Indicator Node -->
  <circle cx="256" cy="405" r="7" fill="#38bdf8"/>
  <circle cx="256" cy="405" r="14" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
</svg>
